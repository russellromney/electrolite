[project]
name = "electrolite"
version = "0.0.0"
description = "Embeddable Electric-style shape sync for SQLite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Russell Romney" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/electrolite"]
