[workspace]
members = [
  "crates/electrolite-core",
  "crates/electrolite-sqlite",
  "crates/electrolite-server",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/russellromney/electrolite"
authors = ["Russell Romney"]

[workspace.dependencies]
electrolite-core = { path = "crates/electrolite-core" }
electrolite-sqlite = { path = "crates/electrolite-sqlite" }
axum = "0.8"
http = "1.3"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
